name: Release

# À chaque push sur main, une release est construite et publiée si la version
# de src-tauri/tauri.conf.json n'a pas encore de release publiée (sinon le job s'arrête en
# quelques secondes). Également déclenchable à la main : Actions → Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version et release existante
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Release publiée pour ce tag ? (un tag seul, laissé par une publication en échec, ne compte pas)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::La release v$VERSION existe déjà, rien à faire."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Création de la release (brouillon)
        id: create
        if: steps.version.outputs.exists == 'false'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            // Brouillons laissés par des releases précédentes en échec (cette version ou une autre) :
            // un seul workflow de release tourne à la fois (concurrency), aucun n'est en cours d'écriture.
            const tag = `v${process.env.VERSION}`;
            const existing = await github.rest.repos.listReleases({ owner: context.repo.owner, repo: context.repo.repo, per_page: 50 });
            for (const r of existing.data.filter((r) => r.draft)) {
              await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: r.id });
              core.notice(`Brouillon ${tag} précédent supprimé (${r.id}).`);
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              target_commitish: context.sha,
              name: `Venice Desktop v${process.env.VERSION}`,
              body: [
                "## Téléchargements",
                "",
                "| Système | Fichier |",
                "|---|---|",
                "| macOS Apple Silicon / ARM (M1…M4) | `Venice.Desktop_*_arm64.dmg` |",
                "| Windows | `Venice.Desktop_*_x64-setup.exe` ou `Venice.Desktop_*_x64_fr-FR.msi` |",
                "| Linux Debian/Ubuntu | `.deb` |",
                "| Linux Fedora/openSUSE | `.rpm` |",
                "| Linux (toutes distributions) | `.AppImage` |",
                "",
                "Binaires non signés par un éditeur (signature ad hoc sur macOS) :",
                "- **macOS** : au premier lancement, Réglages Système → Confidentialité et sécurité → « Ouvrir quand même », ou `xattr -cr \"/Applications/Venice Desktop.app\"`",
                "- **Windows** : SmartScreen → « Informations complémentaires » → « Exécuter quand même »",
              ].join("\n"),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    if: needs.create-release.outputs.release_id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mac Apple Silicon (ARM) uniquement : pas de build Intel.
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - run: npm ci

      # Mises à jour signées : uniquement si la clé privée (secret) et la clé publique (variable)
      # sont configurées dans le dépôt. Sinon, build classique sans installation automatique.
      - name: Signature des mises à jour
        id: updater
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY != '' }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            # La CLI vérifie chaque signature avec la clé publique de la configuration : on la fournit ici.
            CONFIG=$(node -e 'process.stdout.write(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUBKEY.trim()}}}))')
            echo "args=--config '$CONFIG'" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Clé de signature absente : mises à jour à installer manuellement."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
          updaterJsonPreferNsis: true

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publication de la release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id, per_page: 100 });
            const signed = assets.some((a) => a.name.endsWith(".sig"));
            for (const a of assets) {
              if (a.name.endsWith("_aarch64.dmg")) {
                // Nom courant pour les Mac Apple Silicon : arm64 plutôt que aarch64 (même architecture).
                await github.rest.repos.updateReleaseAsset({ ...repo, asset_id: a.id, name: a.name.replace("_aarch64.dmg", "_arm64.dmg") });
              } else if (!signed && a.name.endsWith(".app.tar.gz")) {
                // Archives destinées aux mises à jour automatiques : inutiles sans signature.
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: a.id });
              }
            }
            // Le passage du brouillon en release crée le tag ; l'API renvoie parfois une erreur 500
            // (délai dépassé côté GitHub). Tag créé explicitement d'abord, puis nouvelles tentatives
            // espacées, en vérifiant chaque fois si la publication a quand même abouti.
            const { data: draft } = await github.rest.repos.getRelease({ ...repo, release_id });
            try {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${draft.tag_name}`, sha: draft.target_commitish });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 : le tag existe déjà
            }
            const delays = [0, 15, 30, 60, 120];
            for (const [i, wait] of delays.entries()) {
              await new Promise((r) => setTimeout(r, wait * 1000));
              try {
                await github.rest.repos.updateRelease({ ...repo, release_id, draft: false });
                return;
              } catch (e) {
                const { data: now } = await github.rest.repos.getRelease({ ...repo, release_id }).catch(() => ({ data: { draft: true } }));
                if (!now.draft) return;
                core.warning(`Publication : essai ${i + 1}/${delays.length} en échec (${e.status ?? e.message}).`);
                if (i === delays.length - 1) throw e;
              }
            }
